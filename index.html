<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokenpo | Sagaz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <div class="results">
            <div>
                <span class="user-result">
                    <img src="/img/pedra.png" alt="Escolha do usuário">
                </span>
                <span class="computer-result">
                    <img src="/img/pedra.png" alt="Escolha do computador">
                </span>
            </div>
            <p class="result-text">Bora jogar??</p>
        </div>
        <div class="option">
                <span class="option-image">
                    <img src="/img/pedra.png" alt="Imagem da pedra">
                    <p>Pedra</p>
                </span>
                <span class="option-image">
                    <img src="/img/papel.png" alt="Imagem do papel">
                    <p>Papel</p>
                </span>
                <span class="option-image">
                    <img src="/img/tesoura.png" alt="Imagem da tesoura">
                    <p>Tesoura</p>
                </span>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
